<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Analysis: {business_name}</title>
    <style>
        /* Base styles */
        :root {
            --primary-color: {primary_color};
            --accent-color: {accent_color};
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: #fff;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }
        
        /* Layout */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Typography */
        h1, h2, h3, h4 {
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        /* Cards and sections */
        .section {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        /* Other styles to be filled in by LLM as needed */
    </style>
</head>
<body>
    <header>
        <h1>Website Analysis: {business_name}</h1>
        <p>Source: <a href="{url}" style="color: white; text-decoration: underline;">{url}</a></p>
    </header>
    
    <div class="container">
        <!-- Business Information Section -->
        <div class="section">
            <h2>Business Information</h2>
            <!-- This section will be filled by the LLM -->
        </div>
        
        <!-- Brand Information Section -->
        <div class="section">
            <h2>Brand Identity</h2>
            <!-- This section will be filled by the LLM -->
        </div>
        
        <!-- Other sections as needed -->
    </div>
    
    <footer>
        <p>Generated by Website Cloner</p>
    </footer>
</body>
</html>
